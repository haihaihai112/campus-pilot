[project]
name = "campus-pilot"
version = "0.3.1"
description = "CampusPilot: invite-only campus assistant using MCP and A2A"
requires-python = ">=3.11,<3.13"
dependencies = [
  "a2a-sdk[http-server]>=0.3,<0.4", "mcp>=1.20,<2", "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "openai>=1.75,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "gradio>=5.49,<6", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "scikit-learn>=1.5,<2", "numpy>=1.26,<3",
  "python-dotenv>=1,<2", "icalendar>=6,<8", "tzdata>=2025.1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
[project.optional-dependencies]
milvus = ["pymilvus>=2.5,<3", "milvus-model>=0.2,<1", "sentence-transformers>=3,<6"]
documents = ["pypdf>=5,<7", "python-docx>=1,<2", "python-pptx>=1,<2"]
[project.scripts]
campus = "campus_agent.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/campus_agent"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: real subprocess MCP and A2A tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
